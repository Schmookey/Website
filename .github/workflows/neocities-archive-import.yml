name: One-time verified Neocities archive import

# Temporary import workflow. Only the designated review branch can trigger it.
# It never contacts the Neocities upload API and never deploys to the website.
on:
  push:
    branches:
      - sync/neocities-live-2026-11-13
    paths:
      - .github/workflows/neocities-archive-import.yml

permissions:
  contents: write

concurrency:
  group: one-time-verified-neocities-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          ref: sync/neocities-live-2026-11-13
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Copy public files only if all match user ZIP checksums
        run: python scripts/import_neocities_snapshot.py
