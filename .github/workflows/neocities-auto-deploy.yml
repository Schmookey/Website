name: Neocities automatic site deployment (review-gated)

# Deploy the current main-branch revision after successful site validation or
# a completed content-sync run. Content-sync may commit newer generated files,
# so never deploy the old SHA of a workflow that raced with it.
on:
  workflow_run:
    workflows: ["Static website checks", "Synchronise published feeds, sitemap and post cards"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      preview_only:
        description: "Stage and validate, without uploading"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: neocities-deployment
  cancel-in-progress: false

jobs:
  deploy:
    # Automatic uploads are disabled until the owner enables the repository variable.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main revision
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Require current main revision and reject non-main manual runs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" && "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "::error::Manual runs must select main."
            exit 1
          fi
          HEAD_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$HEAD_SHA" != "$MAIN_SHA" ]]; then
            echo "::error::Main changed during checkout; refusing to deploy."
            exit 1
          fi
      # Each deployment validates the actual current main commit, not an
      # older revision checked by a workflow which may have raced with content
      # synchronization. Protects against GITHUB_TOKEN-generated commits that
      # do not trigger the usual push-based CI.
      - name: Install validation tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the exact content to be deployed
        run: |
          set -euo pipefail
          python3 -m pip install lxml tinycss2 Pillow
          python3 scripts/build_content.py --check
          python3 tests/validate_site.py
          python3 -m unittest discover -s tests -p 'test_content_publishing.py' -v
          python3 -m unittest discover -s tests -p 'test_now_three_sections.py' -v
          python3 -m unittest discover -s tests -p 'test_feeds.py' -v
          python3 -m unittest discover -s tests -p 'test_november_reconciliation.py' -v
          python3 -m unittest discover -s tests -p 'test_indieweb_metadata.py' -v
          python3 -m unittest discover -s tests -p 'test_indexnow_live.py' -v
          python3 -m unittest discover -s tests -p 'test_neocities_deploy.py' -v
          python3 -m unittest discover -s tests -p 'test_verified_syndication.py' -v
          python3 -m unittest discover -s tests -p 'test_trakt_updater.py' -v
          node --check assets/js/main.js
          node --check assets/js/site-search.js
          node --check assets/js/article-sidebar.js
          node --check assets/js/archive.js
          node --check assets/js/trakt-history.js
          node tests/test_security.js
          node tests/test_listenbrainz_covers.js
          node tests/test_trakt_widget.js
      - name: Validate deployment staging inputs
        run: |
          python3 -m unittest discover -s tests -p 'test_neocities_staging.py' -v
          python3 scripts/stage_neocities_site.py --output public
          test -f public/index.html
          test ! -e public/assets/data/trakt-history.json
      - name: Require explicit activation before any upload
        id: gate
        env:
          ENABLED: ${{ vars.NEOCITIES_AUTO_DEPLOY_ENABLED }}
          PREVIEW_ONLY: ${{ inputs.preview_only }}
        run: |
          if [[ "$ENABLED" == "true" && "$PREVIEW_ONLY" != "true" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Preview only: deployment not activated."
          fi
      - name: Recheck that the validated revision remains main
        if: steps.gate.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$HEAD_SHA" != "$MAIN_SHA" ]]; then
            echo "::error::Main changed during validation. Deployment aborted."
            exit 1
          fi
      - name: Verify configured destination
        if: steps.gate.outputs.deploy == 'true'
        env:
          NEOCITIES_API_KEY: ${{ secrets.NEOCITIES_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from scripts.neocities_manual_deploy import request, verify_destination
          key = os.getenv("NEOCITIES_API_KEY", "")
          if not key:
              raise SystemExit("NEOCITIES_API_KEY is missing")
          verify_destination(request("/info", key))
          PY
      - name: Deploy changed public files to Neocities
        if: steps.gate.outputs.deploy == 'true'
        uses: bcomnes/deploy-to-neocities@44e42387b3267e31432ca34b01f013b94956f2f2 # v3.0.6
        with:
          api_key: ${{ secrets.NEOCITIES_API_KEY }}
          dist_dir: public
          cleanup: false
          preview_before_deploy: true
          neocities_supporter: false
