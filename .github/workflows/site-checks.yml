name: Static website checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install static-check dependencies
        run: python -m pip install lxml tinycss2 Pillow
      - name: Generate Notes pages and feeds from metadata
        run: python scripts/build_notes.py
      - name: Generate public feeds and post cards from metadata
        run: python scripts/build_content.py
      - name: Ensure Notes output is deterministic
        run: python scripts/build_notes.py --check
      - name: Ensure generated content is deterministic
        run: python scripts/build_content.py --check
      - name: Test automated post cards and feed rendering
        run: python -m unittest discover -s tests -p 'test_content_publishing.py' -v
      - name: Test Mega Drive article layout, badges and offline search
        run: python -m unittest discover -s tests -p 'test_article_sidebar_search.py' -v
      - name: Check five 88x31 footer badges on every article
        run: python -m unittest discover -s tests -p 'test_article_footer_badges.py' -v
      - name: Verify three-panel Now page
        run: python -m unittest discover -s tests -p 'test_now_three_sections.py' -v
      - name: Verify compact search UI on all post pages
        run: python -m unittest discover -s tests -p 'test_compact_search_ui.py' -v
      - name: Verify Likes panels match Changelog across all articles
        run: python -m unittest discover -s tests -p 'test_article_likes_panel.py' -v
      - name: Check consistent sidebar panels and About button
        run: python -m unittest discover -s tests -p 'test_standard_page_panels.py' -v
      - name: Verify standalone IndieWeb Notes navigation and feeds
        run: python -m unittest discover -s tests -p 'test_notes_section.py' -v
      - name: Verify GitHub Notes publishing safety and output
        run: python -m unittest discover -s tests -p 'test_notes_publishing.py' -v
      - name: Verify homepage Latest Updates 16-bit styling is strictly scoped
        run: python -m unittest discover -s tests -p 'test_home_latest_updates_style.py' -v
      - name: Verify home followed-blog article panels
        run: python -m unittest discover -s tests -p 'test_home_followed_blog_panels.py' -v
      - name: Verify three independent About page media panels
        run: python -m unittest discover -s tests -p 'test_about_right_media_panels.py' -v
      - name: Check ListenBrainz badge sits beside GOG on all pages
        run: python -m unittest discover -s tests -p 'test_listenbrainz_socials_position.py' -v
      - name: Verify site assets and links
        run: python tests/validate_site.py
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/main.js
          node --check assets/js/site-search.js
          node --check assets/js/article-sidebar.js
          node --check assets/js/archive.js
          node --check assets/js/trakt-history.js
      - name: Test URL validation and script loading safeguards
        run: node tests/test_security.js
      - name: Test IndexNow live-page monitoring (offline)
        run: python -m unittest discover -s tests -p 'test_indexnow_live.py' -v
      - name: Test verified social syndication safeguards
        run: python -m unittest discover -s tests -p 'test_verified_syndication.py' -v
      - name: Test Neocities preview-only deployment guardrails
        run: python -m unittest discover -s tests -p 'test_neocities_deploy.py' -v
      - name: Test Marketplace deployment staging exclusions
        run: python -m unittest discover -s tests -p 'test_neocities_staging.py' -v
      - name: Test Trakt history updater and error handling
        run: python -m unittest discover -s tests -p 'test_trakt_updater.py' -v
      - name: Verify JSON, RSS, Atom feed parity and current entries
        run: python -m unittest discover -s tests -p 'test_feeds.py' -v
      - name: Verify reconciled November article metadata and archive URLs
        run: python -m unittest discover -s tests -p 'test_november_reconciliation.py' -v
      - name: Verify IndieWeb metadata and Webmention discovery (offline)
        run: python -m unittest discover -s tests -p 'test_indieweb_metadata.py' -v
      - name: Test ListenBrainz album artwork and fallbacks
        run: node tests/test_listenbrainz_covers.js
      - name: Test Trakt widget data and links
        run: node tests/test_trakt_widget.js
