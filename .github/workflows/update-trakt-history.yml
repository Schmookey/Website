name: Refresh public Trakt watch history

on:
  # Run once when merged so the initial API connection is verified.
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-trakt-history.yml'
      - 'scripts/update_trakt_history.py'
  schedule:
    # GitHub scheduling is best-effort; two staggered automatic attempts each hour
    # reduce the chance of a long gap when one scheduled event is delayed/skipped.
    # No manual dispatch or site deployment is required for data refreshes.
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trakt-watch-history
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Always begin with the latest main rather than the event's older SHA.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh snapshot when credentials are configured
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
        shell: bash
        run: |
          if [ -z "$TRAKT_CLIENT_ID" ]; then
            echo "TRAKT_CLIENT_ID is not configured; keeping the existing snapshot."
            exit 0
          fi
          python3 scripts/update_trakt_history.py
      - name: Commit updated public snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/trakt-history.json
          if git diff --cached --quiet; then
            echo "Trakt history is unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "Refresh public Trakt watch history"
          # A site PR or content-sync commit may land during the API request.
          # Rebase this *single-file* snapshot onto new main and retry without
          # force-pushing or overwriting unrelated website changes.
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Published refreshed Trakt snapshot on attempt $attempt."
              exit 0
            fi
            echo "::warning::Main advanced during Trakt refresh (attempt $attempt); fetching and rebasing."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Trakt snapshot conflicted with newer main. Preserving remote changes; retry on next scheduled run."
              exit 1
            fi
            sleep "$attempt"
          done
          echo "::error::Trakt update could not be published after four non-force retries."
          exit 1
