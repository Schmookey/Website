<!DOCTYPE html>

<!-- Book quotation with inline HUD-red styling -->
<figure class="book-quotation"
        style="margin: 2rem 0;
               padding: 1.4rem;
               background: #21191d;
               color: #f4eef0;
               border: 1px solid #8b0000;
               border-left: 6px solid var(--accent-red, #c1121f);
               border-radius: 6px;
               box-shadow: 0 4px 0 rgba(0,0,0,.35);
               font-size: 1rem;
               line-height: 1.8;">

  <p style="margin: 0 0 1rem;
            color: #ff9199;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 0.08em;
            text-transform: uppercase;">
    BOOK QUOTATION
  </p>

  <blockquote style="margin: 0;
                     padding: 0;
                     border: none;
                     background: transparent;
                     color: #f4eef0;
                     font-style: italic;
                     line-height: 1.8;">

    <p style="margin: 0;">
      “He definitely won't come down to the first floor,
      but do you think, if asked he'd meet me on the
      eighth and give me a piggyback ride? It would
      even suffice if he'd get behind me and push”
    </p>

  </blockquote>

  <figcaption style="margin-top: 1.25rem;
                     padding-top: 0.8rem;
                     border-top: 1px solid #8b3038;
                     font-size: 0.9rem;
                     color: #f4eef0;
                     line-height: 1.7;">

    — <cite class="u-quotation-of h-cite"
            style="font-style: normal;">

      <a class="u-url p-name"
         href="https://library.ltikorea.or.kr/translatedbooks/409241"
         style="color: #ff9199;
                text-decoration: underline;
                text-underline-offset: 3px;">
        Walking Practice
      </a>

      by <span class="p-author h-card">Dolki Min</span>

      (<time class="dt-published"
             datetime="2023">2023</time>)

    </cite>

    <span style="display: block;
                 font-size: 0.8rem;
                 color: #c8b6bb;
                 margin-top: 0.3rem;">
      Translated by Victoria Caudle
    </span>

  </figcaption>

</figure>
